server {
	server_name _;
	root /usr/share/nginx/html;
	client_max_body_size 0;

  # API đi same-origin qua nginx (browser thấy cùng origin, không cần CORS) -
  # đồng nhất với build-web/task-web (xem config/default.conf 2 project đó).
  # Cũng là điều kiện để Safari chấp nhận Set-Cookie ổn định (trước đây sso-web
  # gọi cross-origin thẳng bằng URL tuyệt đối, Safari chặn cookie login).
  # `^~` bắt buộc - lý do giống hệt build-web/task-web: nếu thiếu, path
  # `/api/api-sso/account/avatar/...` (đuôi khớp regex ảnh) bị nhánh cache-asset
  # tĩnh bên dưới giành mất thay vì proxy sang gateway.
  location ^~ /api/ {
		proxy_pass http://api-gateway:6688;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

  # Logo giữ URL cố định, không có content-hash nên phải kiểm tra bản mới sau deploy.
  location = /logo.png {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Metadata release phải luôn phản ánh đúng container đang phục vụ để FE có
  # thể phát hiện bundle cũ sau deploy.
  location = /version.json {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-store, must-revalidate";
	}

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

  # Mọi request TRANG (không phải file có thật) -> api-sso render index.html kèm
  # thẻ meta/Open Graph lấy từ DB (tab Thương hiệu) - bot xem trước link
  # (Zalo/Facebook) không chạy JS vẫn thấy đúng tên/logo tổ chức (26/09/2026).
  # Không có "$uri/" để "/" cũng đi render. api-sso lỗi/chưa cấu hình
  # SSO_WEB_TEMPLATE_URL -> @static trả index.html tĩnh (meta mặc định lúc build).
  location / {
		try_files $uri @render;
		expires -1;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

  location @render {
		# named location không cho proxy_pass kèm URI -> rewrite trước ("?" cuối
		# bỏ query gốc - đường dẫn gốc đi qua header X-Original-Path).
		rewrite ^ /api/api-sso/render-page? break;
		proxy_pass http://api-gateway:6688;
		proxy_set_header Host $host;
		proxy_set_header X-Original-Path $request_uri;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 3s;
		proxy_read_timeout 5s;
		proxy_intercept_errors on;
		error_page 400 401 403 404 500 502 503 504 = @static;
	}

  location @static {
		try_files /index.html =404;
		expires -1;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}
}


server {
	server_name _;
	listen 80;
	return 404;
}
