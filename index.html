<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — XDHY</title>
    <script>
      // OrbStack phục vụ cả HTTP và HTTPS, nhưng SSO dùng cookie Secure và
      // gateway chỉ cho phép origin HTTPS. Chuyển scheme trước khi React gửi
      // request đầu tiên để Safari không chặn preflight vì lệch origin.
      if (location.protocol === 'http:' && location.hostname.endsWith('.orb.local')) {
        location.replace(`https://${location.host}${location.pathname}${location.search}${location.hash}`);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
