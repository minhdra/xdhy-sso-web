server {
	server_name _;
	root /usr/share/nginx/html;

	# index.html không có hash trong tên - luôn lấy bản mới nhất (giống
	# build-web/config/default.conf - cùng lý do: cache index.html cũ sẽ trỏ
	# bundle cũ).
	location / {
		try_files $uri $uri/ /index.html;
		index index.html;
		add_header Cache-Control "no-cache";
	}

	location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
