server {
	server_name _;
	root /usr/share/nginx/html;
	client_max_body_size 0;

  # API đi same-origin qua nginx (browser thấy cùng origin, không cần CORS) -
  # đồng nhất với build-web/task-web (xem config/default.conf 2 project đó).
  # Cũng là điều kiện để Safari chấp nhận Set-Cookie ổn định (trước đây sso-web
  # gọi cross-origin thẳng bằng URL tuyệt đối, Safari chặn cookie login).
  # `^~` bắt buộc - lý do giống hệt build-web/task-web: nếu thiếu, path
  # `/api/api-sso/account/avatar/...` (đuôi khớp regex ảnh) bị nhánh cache-asset
  # tĩnh bên dưới giành mất thay vì proxy sang gateway.
  location ^~ /api/ {
		proxy_pass http://api-gateway:6688;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

  # Logo giữ URL cố định, không có content-hash nên phải kiểm tra bản mới sau deploy.
  location = /logo.png {
		try_files $uri =404;
		expires -1;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

  # index.html không có hash trong tên - luôn lấy bản mới nhất (giống
  # build-web/task-web - cùng lý do: cache index.html cũ sẽ trỏ bundle cũ).
  location / {
		try_files $uri $uri/ /index.html;
		index  index.html index.htm;
		expires -1;
		add_header Cache-Control "no-cache, no-store, must-revalidate";
	}
}


server {
	server_name _;
	listen 80;
	return 404;
}
