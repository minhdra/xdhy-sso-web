server {
	server_name _;
	root /usr/share/nginx/html;
	client_max_body_size 0;

	# API đi same-origin qua nginx để Safari chấp nhận Set-Cookie ổn định. Dùng
	# resolver + biến để nginx vẫn khởi động được khi gateway đang recreate.
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $sso_gateway http://api-gateway-sandbox:6688;
	location ^~ /api/ {
		proxy_pass $sso_gateway;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	# index.html không có hash trong tên - luôn lấy bản mới nhất (giống
	# build-web/config/default.conf - cùng lý do: cache index.html cũ sẽ trỏ
	# bundle cũ).
	location / {
		try_files $uri $uri/ /index.html;
		index index.html;
		add_header Cache-Control "no-cache";
	}

	location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
		try_files $uri =404;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}
